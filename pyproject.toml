[project]
name = "sudoku"
version = "0.1.0"
description = "Terminal Sudoku with Claude Code-inspired UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "numpy>=1.26.0",
]

[project.scripts]
sudoku = "sudoku.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku"]
